<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenProcess3D Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
      #info-overlay {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #e0e0e0;
        font-size: 13px;
        background: rgba(20, 20, 20, 0.75);
        backdrop-filter: blur(6px);
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        pointer-events: none;
        user-select: none;
        max-width: 380px;
        line-height: 1.4;
      }
      #sidebar-container {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 300px;
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        background: rgba(22, 22, 22, 0.88);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        color: #eee;
        padding: 16px;
        font-size: 13px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        z-index: 10;
      }
      #sidebar-container::-webkit-scrollbar {
        width: 6px;
      }
      #sidebar-container::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }
      .controls-section {
        margin-bottom: 20px;
      }
      .controls-section:last-child {
        margin-bottom: 0;
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: #aaa;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 6px;
      }
      .control-group {
        margin-bottom: 12px;
      }
      .control-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .value-display {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        color: #4fc3f7;
      }
      .range-slider {
        width: 100%;
        accent-color: #42a5f5;
        cursor: pointer;
        display: block;
      }
      .control-select {
        width: 100%;
        padding: 6px 8px;
        background: #2a2a2a;
        color: #eee;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 4px;
        font-size: 13px;
        outline: none;
        margin-top: 4px;
        cursor: pointer;
      }
      .control-select:focus {
        border-color: #42a5f5;
      }
      .control-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .layer-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .layer-item {
        display: flex;
        align-items: center;
      }
      .layer-label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        width: 100%;
      }
      .layer-checkbox,
      .section-checkbox {
        accent-color: #42a5f5;
        width: 16px;
        height: 16px;
        cursor: pointer;
      }
      .color-swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        flex-shrink: 0;
      }
      .layer-name {
        font-weight: 500;
        color: #fff;
      }
      .layer-material {
        font-size: 11px;
        color: #888;
        margin-left: 2px;
      }
      .badge-approx {
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        background: #ff9800;
        color: #1a1a1a;
        padding: 1px 5px;
        border-radius: 3px;
        margin-left: auto;
        letter-spacing: 0.5px;
      }
      #error-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ff6b6b;
        font-size: 14px;
        background: rgba(30, 10, 10, 0.92);
        border: 1px solid #ff6b6b;
        padding: 16px 24px;
        border-radius: 8px;
        display: none;
        max-width: 80%;
        white-space: pre-wrap;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-container"></div>
      <div id="info-overlay">OpenProcess3D Viewer</div>
      <div id="sidebar-container"></div>
      <div id="error-overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
